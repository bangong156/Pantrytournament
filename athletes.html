<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vận động viên · The Pantry</title><style>
:root{font-family:system-ui,sans-serif;color:#28341f;background:#f4f2ea}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1020px;margin:auto;padding:24px 16px 70px}a{color:#364b28}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}.panel{background:white;border:1px solid #e0e2d8;border-radius:16px;padding:22px;margin:20px 0}h1{font-size:30px}h2{font-size:21px}.tabs{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:12px 17px;background:#2d3924;color:#fff;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#e7ebdf;color:#26391c}.danger{background:#8b3029}input,select{width:100%;font:inherit;padding:11px;border:1px solid #ccd2c4;border-radius:9px;background:#fff}label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}.rating-pair{display:grid;grid-template-columns:minmax(150px,.85fr) minmax(0,1.15fr);gap:12px;border:1px solid #dce1d4;background:#f8faf5;padding:12px;border-radius:12px}.rating-pair input,.rating-pair select{min-width:0}.inline-check{display:flex;align-items:center;gap:7px;font-weight:500;color:#58634f;font-size:13px}.inline-check input{width:auto}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px}.wide{grid-column:1/-1}.muted{color:#697362}.message{min-height:24px;color:#ad382e}.event{display:block;padding:13px;border:1px solid #dce1d4;border-radius:10px;margin:9px 0;font-weight:500}.event input{width:auto;margin-right:8px}.person{display:flex;gap:14px;align-items:center;border-bottom:1px solid #e8eadf;padding:12px 0}.person img{width:62px;height:62px;object-fit:cover;border-radius:12px;background:#eee}.person small{display:block;color:#697362}.hidden{display:none!important}@media(max-width:650px){.rating-pair{grid-template-columns:minmax(0,1fr) minmax(90px,.65fr);gap:8px;padding:8px}.fields{grid-template-columns:1fr}.panel{padding:15px}}</style></head><body><main class="wrap"><header><a href="/">← THE PANTRY</a><b>VẬN ĐỘNG VIÊN · PICKLEBALL</b></header><h1>CỘNG ĐỒNG VẬN ĐỘNG VIÊN</h1><div class="tabs"><button id="tabList" class="secondary">Vận Động Viên</button><button id="tabRegister">Đăng Ký VĐV</button></div><section class="panel" id="listSection"><h2>Danh sách VĐV đã đăng ký</h2><input id="search" placeholder="Tìm theo tên hoặc nickname"><div id="athleteList">Đang tải…</div></section><section class="panel hidden" id="registerSection"><h2>Đăng ký hồ sơ VĐV</h2><p class="muted">Hồ sơ và ảnh chân dung sẽ xuất hiện trong danh sách công khai. Số điện thoại không được hiển thị công khai.</p><form id="registerForm"><div class="fields" id="mainFields"><div><label>Họ và tên thật *</label><input name="full_name" required maxlength="120"></div><div><label>Nickname đánh pickleball *</label><input name="nickname" required maxlength="80"></div><div><label>Số điện thoại PVNA</label><input name="pvna_phone" required type="tel" maxlength="25" placeholder="SĐT đăng ký PVNA"><label class="inline-check"><input name="no_pvna" type="checkbox"> Chưa có PVNA</label></div><div><label>Điểm PVNA</label><input name="pvna_rating" type="number" min="0" max="10" step=".01" placeholder="Nhập điểm PVNA"></div><div class="wide"><label>Điểm hệ thống khác</label><div class="rating-pair"><select name="other_system" aria-label="Tên hệ thống chấm điểm" required><option value="">Chọn hệ thống *</option><option>Sportconnect</option><option>VDPR</option><option>PH</option><option>DUPR</option><option value="Không có">Không có</option></select><input name="other_rating" aria-label="Điểm trên hệ thống" placeholder="Nhập điểm *" type="number" min="0" max="10" step=".01" required></div></div><div><label>Điểm tự chấm</label><input name="self_rating" type="number" min="0" max="10" step=".01"></div><div><label>Ảnh chân dung đánh pickleball rõ mặt *</label><input name="portrait" type="file" accept="image/jpeg,image/png,image/webp" required></div></div><h2>Giải đang mở đăng ký</h2><div id="openEvents">Đang tải…</div><div id="partnerSection" class="hidden"><h2>Chọn Partner</h2><label>Partner đã có hồ sơ</label><select id="partnerSelect"><option value="">-- Chọn partner --</option></select><label><input id="newPartnerToggle" type="checkbox" style="width:auto"> Partner chưa đăng ký — đăng ký giúp</label><div id="newPartnerFields" class="fields hidden"><div><label>Họ tên partner *</label><input name="partner_full_name"></div><div><label>Nickname partner *</label><input name="partner_nickname"></div><div><label>Số điện thoại PVNA partner</label><input name="partner_pvna_phone" type="tel"><label class="inline-check"><input name="partner_no_pvna" type="checkbox"> Chưa có PVNA</label></div><div><label>Điểm PVNA partner</label><input name="partner_pvna_rating" type="number" min="0" max="10" step=".01"></div><div class="wide"><label>Điểm hệ thống khác của partner</label><div class="rating-pair"><select name="partner_other_system" aria-label="Tên hệ thống điểm partner"><option value="">Chọn hệ thống *</option><option>Sportconnect</option><option>VDPR</option><option>PH</option><option>DUPR</option><option value="Không có">Không có</option></select><input name="partner_other_rating" aria-label="Điểm hệ thống partner" placeholder="Nhập điểm *" type="number" min="0" max="10" step=".01"></div></div><div><label>Điểm tự chấm partner</label><input name="partner_self_rating" type="number" min="0" max="10" step=".01"></div><div><label>Ảnh partner rõ mặt *</label><input name="partner_portrait" type="file" accept="image/jpeg,image/png,image/webp"></div></div></div><p class="message" id="message" role="alert"></p><button type="submit" id="submitRegistration">Gửi đăng ký</button></form></section></main><script type="module" src="/athletes.js"></script></body></html>
